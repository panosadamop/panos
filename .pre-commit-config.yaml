# Optional local hooks: `uvx pre-commit install`. CI runs the same checks.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: trace-registry
        name: requirement registry up to date
        entry: uv run python scripts/trace_registry.py --check
        language: system
        pass_filenames: false
        files: ^docs/specs/
