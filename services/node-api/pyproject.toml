[project]
name = "panos-node-api"
version = "0.1.0"
description = "Panos local node API (FastAPI) — versioned loopback API for desktop and CLI"
requires-python = ">=3.12"
dependencies = [
    "panos-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panos_node_api"]
