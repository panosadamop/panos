[project]
name = "panos-cli"
version = "0.1.0"
description = "Panos command-line interface (thin client to the local node API)"
requires-python = ">=3.12"
dependencies = [
    "panos-core",
    "panos-node-api",
    "typer>=0.15",
    "httpx>=0.28",
]

[project.scripts]
panos = "panos_cli.main:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panos_cli"]
