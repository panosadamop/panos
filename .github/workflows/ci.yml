name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.12", "3.14"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --all-packages --locked
      - name: Format
        run: uv run ruff format --check
      - name: Lint
        run: uv run ruff check
      - name: Type check
        run: uv run mypy
      - name: Architecture contracts
        run: uv run lint-imports
      - name: Requirement registry
        run: uv run python scripts/trace_registry.py --check
      - name: OpenAPI schema up to date
        run: uv run python scripts/export_openapi.py --check
      - name: Tests
        run: >
          uv run pytest --cov --cov-report=term-missing
          --req-report=docs/traceability/coverage.md

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Dependency vulnerability audit
        run: uvx pip-audit --strict --progress-spinner off -r <(uv export --all-packages --no-hashes --no-emit-workspace --format requirements-txt)
