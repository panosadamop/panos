name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.12", "3.14"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --all-packages --locked
      - name: Format
        run: uv run ruff format --check
      - name: Lint
        run: uv run ruff check
      - name: Type check
        run: uv run mypy
      - name: Architecture contracts
        run: uv run lint-imports
      - name: Requirement registry
        run: uv run python scripts/trace_registry.py --check
      - name: OpenAPI schema up to date
        run: uv run python scripts/export_openapi.py --check
      - name: Tests
        run: >
          uv run pytest --cov --cov-report=term-missing
          --req-report=docs/traceability/coverage.md

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Dependency vulnerability audit
        run: uvx pip-audit --strict --progress-spinner off -r <(uv export --all-packages --no-hashes --no-emit-workspace --format requirements-txt)

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm --filter panos-desktop typecheck
      - name: UI tests (Vitest, Testing Library, axe)
        run: pnpm --filter panos-desktop test
      - name: Generated API and event types up to date
        run: pnpm --filter panos-desktop check:gen

  shell:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Prepare frontend dist (tauri::generate_context! needs it)
        run: mkdir ..\dist; echo "<html></html>" > ..\dist\index.html
        shell: pwsh
      - name: Rust tests
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
